schema_version: conditions.v1
profile: matrix-small
groups: 1
works_per_group: 1
spec: 2v2g
concurrency: 1
max_work_concurrency: 1
requests: 2
methods: [B01.TEMPLATE]
axes:
  specs: [2v2g, 2v4g]
  concurrency: [1, 2]
  requests: [2]
notes: "2 规格 × 2 并发 × 1 请求 = 4 格"
