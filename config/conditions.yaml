# 条件参数文件：低条件验证档
#
# 用途：把测试条件从脚本硬编码中解耦，整体调到很低（单组、2 沙箱、并发 1、2v2g），
#       仅用于验证**图工程 / 循环工程**是否打通，**不产出任何性能结论**。
#
# 用法：
#   .venv/bin/python scripts/local_mock_run.py --profile config/conditions.yaml
#   .venv/bin/python scripts/matrix_run.py     --profile config/conditions.yaml
#
# 字段说明见 docs/conditions-profile.md；未知字段会被拒绝（不会静默忽略）。
schema_version: conditions.v1
profile: verify-low
groups: 1
works_per_group: 2
target_density_per_node: 2
spec: 2v2g
concurrency: 1
max_work_concurrency: 1
requests: 2
repeat: 1
methods: [B01.TEMPLATE]
topology: node_direct
completion_endpoint: STATE_READY
fail_last_group: false
notes: "低条件验证档；仅验证图与循环打通，不含性能意义"
